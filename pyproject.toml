[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-apigw-stage-audit"
version = "0.1.0"
description = "Audit API Gateway REST and HTTP API stages for missing logs, absent throttling, open methods and stale TLS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "api-gateway", "audit", "sre", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
aws-apigw-stage-audit = "aws_apigw_stage_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-apigw-stage-audit"
Issues = "https://github.com/moveeeax/aws-apigw-stage-audit/issues"

[tool.setuptools]
packages = ["aws_apigw_stage_audit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
